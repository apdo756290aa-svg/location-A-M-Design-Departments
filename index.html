<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&M Code | لوحة التحكم والتسلسل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-inner: #050914;
            --neon-blue: #00d2ff;
            --dark-red: #800020;
            --bright-red: #ff2a5f;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glow-blue: rgba(0, 210, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        #binary-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 1;
        }

        /* Header Navigation */
        .top-navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            background: var(--dark-red);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .brand-title { font-weight: 800; font-size: 1rem; color: var(--text-main); }
        .brand-sub { font-size: 0.75rem; color: var(--neon-blue); }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-refresh:hover { border-color: var(--neon-blue); }

        /* Queue / Sorting Alert Bar */
        .queue-info-bar {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--neon-blue);
            font-weight: 700;
        }

        /* Order Cards Layout */
        .order-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
        }

        .order-card.first-in-queue {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--glow-blue);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .queue-badge {
            background: linear-gradient(135deg, var(--neon-blue), #0072ff);
            color: #000;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .queue-badge.priority-1 {
            background: linear-gradient(135deg, var(--bright-red), var(--dark-red));
            color: #fff;
        }

        .order-time {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .client-info {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .client-info strong {
            color: var(--text-main);
        }

        .order-details-box {
            background: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.88rem;
            color: #cbd5e1;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-act {
            height: 35px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .btn-wa-a { background: rgba(0, 210, 255, 0.15); color: var(--neon-blue); border: 1px solid rgba(0, 210, 255, 0.3); }
        .btn-wa-m { background: rgba(255, 42, 95, 0.15); color: var(--bright-red); border: 1px solid rgba(255, 42, 95, 0.3); }

        .btn-done { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    </style>
</head>
<body>

    <canvas id="binary-canvas"></canvas>

    <div class="container">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="nav-brand">
                <div class="brand-icon"><i class="fa-solid fa-list-ol"></i></div>
                <div>
                    <div class="brand-title">إدارة الطلبات بالدور والتسلسل</div>
                    <div class="brand-sub">A&M CODE ADMIN</div>
                </div>
            </div>
            <button class="btn-refresh" onclick="renderQueueOrders()"><i class="fa-solid fa-rotate-right"></i> تحديث الأدوار</button>
        </div>

        <!-- Info Header -->
        <div class="queue-info-bar">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>الطلبات مرتبة تلقائياً من **الأقدم للأحدث** (الطلب رقم 1 هو اللي جه الأول بالدور).</span>
        </div>

        <!-- Orders Container -->
        <div id="queue-container"></div>
    </div>

    <script>
        const phone1 = "201148041323"; // عبد الرحمن
        const phone2 = "201279364446"; // محمود

        // Canvas Effect
        const canvas = document.getElementById('binary-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawBinary() {
            ctx.fillStyle = 'rgba(7, 10, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00d2ff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawBinary, 33);

        // Fetch & Sort Orders FIFO (First In, First Out)
        function getOrdersSorted() {
            let orders = JSON.parse(localStorage.getItem('am_code_orders')) || [
                { id: 101, name: "صيدلية الأمل", phone: "01012345678", desc: "موقع صيدلية متكامل مع خدمة توصيل", timestamp: 1700000000000, timeStr: "منذ 10 دقائق" },
                { id: 102, name: "صيدلية الشفاء", phone: "01198765432", desc: "طلب موقع صيدلية مشابه ولكن بعده بدقيقة", timestamp: 1700000060000, timeStr: "منذ 9 دقائق" }
            ];

            // الترتيب الصاعد: الأقدم زمانياً يظهر أولاً (الأولوية للرقم 1)
            orders.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            return orders;
        }

        function renderQueueOrders() {
            const container = document.getElementById('queue-container');
            container.innerHTML = '';

            const sortedOrders = getOrdersSorted();

            if (sortedOrders.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px;">لا توجد طلبات في الانتظار حالياً.</div>`;
                return;
            }

            sortedOrders.forEach((order, index) => {
                const queueNumber = index + 1; // ترتيب الدور: 1، 2، 3...
                const card = document.createElement('div');
                card.className = `order-card ${queueNumber === 1 ? 'first-in-queue' : ''}`;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="queue-badge ${queueNumber === 1 ? 'priority-1' : ''}">
                            ${queueNumber === 1 ? '🔴 الأول بالدور (#1)' : 'الدور رقم #' + queueNumber}
                        </div>
                        <div class="order-time"><i class="fa-regular fa-clock"></i> ${order.timeStr || 'طلب مسجل'}</div>
                    </div>
                    <div class="client-info">
                        <strong>العميل:</strong> ${order.name} | <strong>الهاتف:</strong> ${order.phone}
                    </div>
                    <div class="order-details-box">
                        <strong>تفاصيل الطلب:</strong> ${order.desc}
                    </div>
                    <div class="card-bottom">
                        <div class="action-btns">
                            <button class="btn-act btn-delete" onclick="deleteOrder(${order.id})" title="حذف الطلب بعد الانتهاء"><i class="fa-solid fa-trash"></i></button>
                            <button class="btn-act btn-wa-a" onclick="shareWhatsApp('${phone1}', ${queueNumber}, '${order.name}', '${order.desc}')"><i class="fa-brands fa-whatsapp"></i> عبدو</button>
                            <button class="btn-act btn-wa-m" onclick="shareWhatsApp('${phone2}', ${queueNumber}, '${order.name}', '${order.desc}')"><i class="fa-brands fa-whatsapp"></i> محمود</button>
                        </div>
                        <button class="btn-act btn-done" onclick="finishOrder(${order.id})"><i class="fa-solid fa-check"></i> تم التنفيذ</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteOrder(id) {
            if (confirm('هل تريد إزالة هذا الطلب من الدور؟')) {
                let orders = JSON.parse(localStorage.getItem('am_code_orders')) || [];
                orders = orders.filter(o => o.id !== id);
                localStorage.setItem('am_code_orders', JSON.stringify(orders));
                renderQueueOrders();
            }
        }

        function finishOrder(id) {
            alert('تم تعليم الطلب كمكتمل وسينتقل الطلب التالي ليكون رقم #1 تلقائياً!');
            deleteOrder(id);
        }

        function shareWhatsApp(phone, queueNum, clientName, desc) {
            let msg = `📌 طلب بالدور رقم (#${queueNum}):\n👤 العميل: ${clientName}\n📝 التفاصيل: ${desc}`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // Initial Load
        renderQueueOrders();
    </script>
</body>
</html>
